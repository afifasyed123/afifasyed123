name: Neon Arcade Simulation

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/game_engine.py'

permissions:
  contents: write

jobs:
  run-simulation:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🕹️ Run Arcade Agent Simulation
        run: |
          python scripts/game_engine.py

      - name: 🚀 Save Simulation Telemetry
        run: |
          git config --local user.email "afifasyed06@gmail.com"
          git config --local user.name "afifa syed"
          git add data/game_state.json assets/game-board.svg README.md
          
          STAGE=$(python -c "import json; d=json.load(open('data/game_state.json')); print(d.get('level', 1))")
          SCORE=$(python -c "import json; d=json.load(open('data/game_state.json')); print(d.get('score', 0))")
          
          git commit -m "🕹️ Neon Arcade: Stage ${STAGE} simulation update | Score: ${SCORE} [skip ci]" || echo "No changes to commit"
          git push
