name: Barbiecore Pet Interaction

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  pamper-pet:
    # Only run if issue title starts with pet:
    if: startsWith(github.event.issue.title, 'pet:')
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🎀 Pamper Bella & Update Stats
        run: |
          python scripts/pet_engine.py --action "${{ github.event.issue.title }}" --user "${{ github.event.issue.user.login }}"

      - name: 🚀 Commit & Push Updated Pet State
        run: |
          git config --local user.email "afifasyed06@gmail.com"
          git config --local user.name "afifa syed"
          git add data/pet_state.json assets/pet-card.svg README.md
          git commit -m "🎀 Bella: ${{ github.event.issue.title }} from @${{ github.event.issue.user.login }} [skip ci]" || echo "No changes to commit"
          git push

      - name: 💌 Thank Caretaker & Close Issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body-file data/last_comment.md
          gh issue close "$ISSUE_NUMBER" --reason "completed"
