name: Barbiecore Pet Hourly Stat Decay

on:
  schedule:
    # Runs every hour to simulate natural time passing
    - cron: '0 * * * *'
  workflow_dispatch: # Allows manual trigger anytime from Actions tab

permissions:
  contents: write

jobs:
  decay-stats:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: ⏳ Apply Natural Stat Decay
        run: |
          python scripts/pet_engine.py --decay

      - name: 🚀 Commit & Push State Update
        run: |
          git config --local user.email "afifasyed06@gmail.com"
          git config --local user.name "afifa syed"
          git add data/pet_state.json assets/pet-card.svg README.md
          git commit -m "✨ Bella: Hourly Mood & Care Update [skip ci]" || echo "No changes to commit"
          git push
