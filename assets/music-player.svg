<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 170" width="100%" height="auto">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161B22" />
      <stop offset="50%" stop-color="#1A1528" />
      <stop offset="100%" stop-color="#161B22" />
    </linearGradient>

    <!-- Barbie Pink Border Gradient -->
    <linearGradient id="barbiePinkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF1493" />
      <stop offset="50%" stop-color="#F472B6" />
      <stop offset="100%" stop-color="#FF69B4" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="pinkGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Vinyl Groove Pattern -->
    <radialGradient id="vinylGroove" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1C2128" />
      <stop offset="40%" stop-color="#0D1117" />
      <stop offset="75%" stop-color="#161B22" />
      <stop offset="100%" stop-color="#090C10" />
    </radialGradient>
  </defs>

  <style>
    .player-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 700; }
    .mono-scrubber { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, Courier, monospace; font-weight: 600; }
    .vibe-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 500; }
  </style>

  <!-- Player Outer Card -->
  <rect x="2" y="2" width="556" height="166" rx="16" fill="url(#cardBg)" stroke="url(#barbiePinkGrad)" stroke-width="2" />

  <!-- Background Sparkles -->
  <g fill="#FFB6C1" opacity="0.35">
    <text x="50" y="32" font-size="10">✦
      <animate attributeName="opacity" values="0.1;0.6;0.1" dur="3s" repeatCount="indefinite" />
    </text>
    <text x="520" y="145" font-size="12">✧
      <animate attributeName="opacity" values="0.6;0.1;0.6" dur="2.5s" repeatCount="indefinite" />
    </text>
    <text x="140" y="145" font-size="9">✦
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="2.8s" repeatCount="indefinite" />
    </text>
  </g>

  <!-- Top Cassette / Window Bar -->
  <g transform="translate(20, 16)">
    <!-- Window Dots -->
    <circle cx="6" cy="6" r="4" fill="#FF1493" />
    <circle cx="20" cy="6" r="4" fill="#F472B6" />
    <circle cx="34" cy="6" r="4" fill="#FFB6C1" />

    <!-- Widget Tag -->
    <text x="56" y="9.5" fill="#F472B6" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="10.5" letter-spacing="1">BARBIE RETRO BOOMBOX</text>

    <!-- Animated Equalizer Waves -->
    <g transform="translate(480, 0)">
      <rect x="0" y="2" width="3" height="8" rx="1.5" fill="#FF1493">
        <animate attributeName="height" values="4;12;6;12;4" dur="1.1s" repeatCount="indefinite" />
        <animate attributeName="y" values="6;0;4;0;6" dur="1.1s" repeatCount="indefinite" />
      </rect>
      <rect x="6" y="0" width="3" height="12" rx="1.5" fill="#F472B6">
        <animate attributeName="height" values="12;4;12;7;12" dur="0.9s" repeatCount="indefinite" />
        <animate attributeName="y" values="0;6;0;3;0" dur="0.9s" repeatCount="indefinite" />
      </rect>
      <rect x="12" y="4" width="3" height="8" rx="1.5" fill="#FF69B4">
        <animate attributeName="height" values="6;12;5;12;6" dur="1.3s" repeatCount="indefinite" />
        <animate attributeName="y" values="4;0;5;0;4" dur="1.3s" repeatCount="indefinite" />
      </rect>
      <rect x="18" y="1" width="3" height="10" rx="1.5" fill="#FFB6C1">
        <animate attributeName="height" values="8;4;11;5;8" dur="1.0s" repeatCount="indefinite" />
        <animate attributeName="y" values="2;6;0;5;2" dur="1.0s" repeatCount="indefinite" />
      </rect>
    </g>
  </g>

  <!-- Horizontal Divider -->
  <line x1="20" y1="36" x2="540" y2="36" stroke="#30363D" stroke-width="1" />

  <!-- Left: Spinning Retro Vinyl Record -->
  <g transform="translate(68, 98)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="5s" repeatCount="indefinite" />
      <!-- Outer Vinyl Body -->
      <circle cx="0" cy="0" r="42" fill="url(#vinylGroove)" stroke="#30363D" stroke-width="1.5" />
      <circle cx="0" cy="0" r="34" fill="none" stroke="#21262D" stroke-width="0.8" />
      <circle cx="0" cy="0" r="26" fill="none" stroke="#21262D" stroke-width="0.8" />
      <circle cx="0" cy="0" r="18" fill="none" stroke="#21262D" stroke-width="0.8" />
      
      <!-- Barbiecore Center Label -->
      <circle cx="0" cy="0" r="15" fill="#FF1493" filter="url(#pinkGlow)" />
      <circle cx="0" cy="0" r="13" fill="#F472B6" />
      <circle cx="0" cy="0" r="4" fill="#161B22" />
      
      <!-- Record Shine Highlights -->
      <path d="M 0 -34 A 34 34 0 0 1 24 -24 L 12 -12 A 16 16 0 0 0 0 -16 Z" fill="#FFFFFF" opacity="0.09" />
      <path d="M 0 34 A 34 34 0 0 1 -24 24 L -12 12 A 16 16 0 0 0 0 16 Z" fill="#FFFFFF" opacity="0.09" />
    </g>
  </g>

  <!-- Right: Music Info & Scrubber -->
  <g transform="translate(130, 45)">
    <!-- Line 1: Song & Artist -->
    <g transform="translate(0, 24)">
      <text x="0" y="0" class="player-title" font-size="14.5" fill="#FFFFFF">
        <tspan fill="#FF1493" font-size="14">▶</tspan> Now Playing: <tspan fill="#F472B6">[SONG_NAME]</tspan> - <tspan fill="#FFB6C1">[ARTIST]</tspan> <tspan font-size="14">🎀</tspan>
      </text>
    </g>

    <!-- Line 2: Monospace Scrubber Bar -->
    <g transform="translate(0, 56)">
      <text x="0" y="0" class="mono-scrubber" font-size="13" fill="#E6EDF3" letter-spacing="0.8">
        <tspan fill="#FFB6C1">01:24</tspan> <tspan fill="#F472B6">───</tspan><tspan fill="#FF1493" font-size="15">●<animate attributeName="fill" values="#FF1493;#FF69B4;#FF1493" dur="1.8s" repeatCount="indefinite" /></tspan><tspan fill="#8B949E">──────────</tspan> <tspan fill="#FFB6C1">03:45</tspan> <tspan fill="#F472B6" font-size="12">🔊</tspan>
      </text>
    </g>

    <!-- Line 3: Cute Vibe Text -->
    <g transform="translate(0, 86)">
      <text x="0" y="0" class="vibe-text" font-size="11.5" fill="#F472B6">
        <animate attributeName="opacity" values="0.7;1;0.7" dur="2.5s" repeatCount="indefinite" />
        ✧ Click card to listen along with me ✧
      </text>
    </g>
  </g>
</svg>
