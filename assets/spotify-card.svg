<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 440" width="340" height="440">
  <defs>
    <clipPath id="albumClip">
      <rect x="35" y="120" width="270" height="270" rx="12" ry="12" />
    </clipPath>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <style>
    .spotify-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #1ED760; }
    .track-name { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 22px; font-weight: 800; fill: #FFFFFF; text-anchor: middle; }
    .artist-name { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 500; fill: #9CA3AF; text-anchor: middle; }
  </style>

  <!-- Background Card -->
  <rect x="2" y="2" width="336" height="436" rx="16" fill="#0D1117" stroke="#21262D" stroke-width="1.5" filter="url(#cardShadow)" />

  <!-- Top Spotify Badge Indicator -->
  <g transform="translate(85, 24)">
    <text x="0" y="12" class="spotify-label">Recently played on</text>
    <g transform="translate(130, -2)">
      <!-- Spotify Green Icon -->
      <circle cx="8" cy="8" r="8" fill="#1ED760" />
      <path d="M4.5 5.5 C7 4.5 10 5 11.5 6 M4.8 7.8 C6.8 7 9.5 7.4 10.8 8.2 M5.2 10 C6.8 9.3 8.8 9.6 9.8 10.2" stroke="#0D1117" stroke-width="1.3" stroke-linecap="round" fill="none" />
    </g>
  </g>

  <!-- Track Title -->
  <text x="170" y="76" class="track-name">NEXT!</text>

  <!-- Artist Subtitle -->
  <text x="170" y="100" class="artist-name">NCTS</text>

  <!-- Album Artwork -->
  <image href="https://raw.githubusercontent.com/afifasyed123/afifasyed123/main/assets/spotify-album-art.jpg" x="35" y="120" width="270" height="270" clip-path="url(#albumClip)" preserveAspectRatio="xMidYMid slice" />
</svg>
